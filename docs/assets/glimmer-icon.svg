<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="35%" stop-color="#E0F7FF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0277BD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7C4DFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Soft outer aura -->
  <circle cx="256" cy="256" r="210" fill="url(#aura)"/>

  <!-- Light Being form -->
  <g filter="url(#glow)">
    <!-- Lower energy base -->
    <path d="M160 340 C200 290, 230 260, 256 255 C282 260, 312 290, 352 340 C330 370, 290 385, 256 382 C222 385, 182 370, 160 340Z" 
          fill="#00B8D4" opacity="0.4"/>

    <!-- Main body -->
    <path d="M185 250 C215 175, 240 145, 256 140 C272 145, 297 175, 327 250 C315 300, 285 320, 256 318 C227 320, 197 300, 185 250Z" 
          fill="#00E5FF" opacity="0.65"/>

    <!-- Upper flame / crown -->
    <path d="M215 165 C235 95, 248 70, 256 65 C264 70, 277 95, 297 165 C285 195, 270 210, 256 208 C242 210, 227 195, 215 165Z" 
          fill="#E0F7FF" opacity="0.8"/>

    <!-- Bright core -->
    <ellipse cx="256" cy="230" rx="48" ry="62" fill="url(#core)"/>
  </g>

  <!-- Inner pure light -->
  <ellipse cx="256" cy="225" rx="26" ry="34" fill="#FFFFFF" opacity="0.9"/>
</svg>
