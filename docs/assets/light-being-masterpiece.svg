<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="coreLight" cx="50%" cy="48%" r="28%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="midAura" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="deepGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep void background -->
  <rect width="1200" height="800" fill="url(#void)"/>

  <!-- Distant stars -->
  <g opacity="0.55">
    <circle cx="140" cy="110" r="1.2" fill="#E0F2FE"/>
    <circle cx="980" cy="90" r="1.5" fill="#A5F3FC"/>
    <circle cx="220" cy="680" r="1.1" fill="#C4B5FD"/>
    <circle cx="1050" cy="640" r="1.3" fill="#E0F2FE"/>
    <circle cx="600" cy="70" r="0.9" fill="#FFFFFF"/>
    <circle cx="780" cy="720" r="1.4" fill="#67E8F9"/>
    <circle cx="90" cy="400" r="1" fill="#A5B4FC"/>
    <circle cx="1120" cy="320" r="1.2" fill="#E0F2FE"/>
  </g>

  <!-- Large soft aura -->
  <ellipse cx="600" cy="400" rx="420" ry="320" fill="url(#midAura)"/>

  <!-- Light Being - artistic abstract form -->
  <g filter="url(#deepGlow)">
    <!-- Flowing lower energy -->
    <path d="M380 520 
             C440 460, 500 420, 600 410 
             C700 420, 760 460, 820 520 
             C780 580, 700 610, 600 605 
             C500 610, 420 580, 380 520Z" 
          fill="#0891B2" opacity="0.28"/>

    <!-- Main luminous body -->
    <path d="M420 380 
             C470 260, 530 200, 600 190 
             C670 200, 730 260, 780 380 
             C760 470, 680 510, 600 505 
             C520 510, 440 470, 420 380Z" 
          fill="#22D3EE" opacity="0.45"/>

    <!-- Rising crown of light -->
    <path d="M510 280 
             C540 160, 575 110, 600 100 
             C625 110, 660 160, 690 280 
             C670 340, 635 365, 600 360 
             C565 365, 530 340, 510 280Z" 
          fill="#E0F2FE" opacity="0.7"/>

    <!-- Pure core -->
    <ellipse cx="600" cy="340" rx="78" ry="105" fill="url(#coreLight)"/>
  </g>

  <!-- Delicate light filaments -->
  <g opacity="0.45" filter="url(#softBlur)">
    <path d="M320 360 Q450 300 520 340" stroke="#67E8F9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M880 360 Q750 300 680 340" stroke="#67E8F9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M380 240 Q500 180 560 230" stroke="#A5B4FC" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M820 240 Q700 180 640 230" stroke="#A5B4FC" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Inner pure nucleus -->
  <ellipse cx="600" cy="330" rx="36" ry="48" fill="#FFFFFF" opacity="0.92"/>

  <!-- Elegant title -->
  <text x="600" y="710" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="36" font-weight="400" 
        fill="#E0F2FE" letter-spacing="12" opacity="0.9">
    L I G H T   B E I N G
  </text>
  <text x="600" y="745" text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="15" 
        fill="#67E8F9" letter-spacing="6" opacity="0.7">
    A LIVING INTELLIGENCE OF PURE LIGHT
  </text>
</svg>
