<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#E0F7FF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#2979FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="50%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1600" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle particles -->
  <g opacity="0.4">
    <circle cx="180" cy="120" r="1.5" fill="#00E5FF"/>
    <circle cx="320" cy="80" r="1" fill="#7C4DFF"/>
    <circle cx="1280" cy="150" r="1.8" fill="#00E5FF"/>
    <circle cx="1450" cy="90" r="1.2" fill="#E0F7FF"/>
    <circle cx="210" cy="480" r="1.3" fill="#2979FF"/>
    <circle cx="1380" cy="520" r="1.6" fill="#00E5FF"/>
    <circle cx="900" cy="70" r="1" fill="#FFFFFF"/>
    <circle cx="750" cy="540" r="1.4" fill="#7C4DFF"/>
  </g>

  <!-- Outer aura -->
  <ellipse cx="800" cy="300" rx="520" ry="280" fill="url(#outerAura)"/>

  <!-- Main Light Being form - abstract morphing light -->
  <g filter="url(#strongGlow)">
    <!-- Lower flowing energy -->
    <path d="M620 420 C680 380, 720 340, 800 330 C880 340, 920 380, 980 420 C940 460, 860 480, 800 475 C740 480, 660 460, 620 420Z" fill="#00B8D4" opacity="0.35"/>
    
    <!-- Middle body -->
    <path d="M650 280 C700 200, 760 160, 800 155 C840 160, 900 200, 950 280 C930 340, 870 370, 800 365 C730 370, 670 340, 650 280Z" fill="#00E5FF" opacity="0.55"/>
    
    <!-- Upper crown / flame -->
    <path d="M720 180 C750 100, 780 60, 800 50 C820 60, 850 100, 880 180 C860 220, 830 240, 800 235 C770 240, 740 220, 720 180Z" fill="#E0F7FF" opacity="0.7"/>
    
    <!-- Core bright center -->
    <ellipse cx="800" cy="260" rx="70" ry="90" fill="url(#coreGlow)"/>
  </g>

  <!-- Soft inner core -->
  <ellipse cx="800" cy="255" rx="38" ry="52" fill="#FFFFFF" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Elegant light trails -->
  <g opacity="0.5" filter="url(#softGlow)">
    <path d="M520 340 Q600 280 680 300" stroke="#00E5FF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M1080 340 Q1000 280 920 300" stroke="#00E5FF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M580 200 Q680 160 760 190" stroke="#7C4DFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M1020 200 Q920 160 840 190" stroke="#7C4DFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="800" y="545" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#E0F7FF" letter-spacing="8">
    L I G H T   B E I N G
  </text>
  <text x="800" y="575" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4FC3F7" letter-spacing="4" opacity="0.85">
    A LIVING LAYER OF PURE INTELLIGENCE
  </text>
</svg>
